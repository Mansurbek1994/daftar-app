<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daftar">
<meta name="theme-color" content="#efe6d3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Daftar — oylik hisob</title>
<style>
  :root{
    --paper:#efe6d3;
    --paper-dark:#e4d8bd;
    --ink:#2e2a22;
    --ink-soft:#6b6252;
    --line:#c9bb9c;
    --barn:#a14e3a;
    --field:#4c6b4f;
    --coin:#b9862f;
    --sky:#3c5a6b;
    --card:#fbf7ec;
    --danger:#a14e3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(#efe6d3 0 31px, var(--line) 31px 32px);
    background-color:var(--paper);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:0;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:transparent;
    position:relative;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
  }
  header{
    padding:26px 22px 14px;
    border-bottom:2px solid var(--ink);
    position:relative;
  }
  header .tab{
    position:absolute;
    top:-10px;
    left:22px;
    background:var(--coin);
    color:var(--card);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:0 0 6px 6px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  h1{
    font-size:26px;
    margin:8px 0 2px;
    letter-spacing:0.5px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:13px;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  .income-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-top:14px;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .income-row label{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .income-row input{
    border:none;
    border-bottom:1.5px dashed var(--ink);
    background:transparent;
    font-family:'Georgia', serif;
    font-size:20px;
    color:var(--ink);
    width:150px;
    padding:2px 0;
    outline:none;
  }

  .summary{
    margin:18px 22px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    box-shadow:0 3px 0 rgba(46,42,34,0.06);
    display:flex;
    align-items:center;
    gap:16px;
  }
  #donut{ flex-shrink:0; }
  .summary-text{ font-family:'Helvetica Neue', Arial, sans-serif; }
  .summary-text .big{
    font-family:'Georgia', serif;
    font-size:22px;
    color:var(--ink);
  }
  .summary-text .big.neg{ color:var(--danger); }
  .summary-text .small{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .legend{
    margin:14px 22px 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 14px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12.5px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .legend-item .dot{
    width:9px;height:9px;border-radius:2px;flex-shrink:0;
  }
  .legend-item .amt{
    margin-left:auto;
    color:var(--ink);
  }

  .add-card{
    margin:20px 22px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .add-card .title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    font-family:'Helvetica Neue', Arial, sans-serif;
    margin-bottom:10px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:12px;
  }
  .cat-btn{
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    padding:8px 2px;
    font-size:19px;
    cursor:pointer;
    font-family:'Helvetica Neue', Arial, sans-serif;
    transition: all 0.12s;
  }
  .cat-btn .lbl{
    display:block;
    font-size:9px;
    margin-top:2px;
    color:var(--ink-soft);
  }
  .cat-btn.active{
    border-color:var(--ink);
    background:var(--ink);
  }
  .cat-btn.active .lbl{ color:var(--paper); }

  .field-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .field-row input{
    flex:1;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:7px;
    padding:9px 10px;
    font-family:'Georgia', serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  .field-row input::placeholder{ color:#a89d84; }

  .add-btn{
    width:100%;
    border:none;
    background:var(--field);
    color:var(--card);
    padding:11px;
    border-radius:8px;
    font-size:14px;
    letter-spacing:0.5px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.98); }

  .ledger{
    margin:20px 22px 0;
  }
  .ledger .title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    font-family:'Helvetica Neue', Arial, sans-serif;
    margin-bottom:8px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry .icon{
    width:32px;height:32px;
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .entry .info{ flex:1; min-width:0; }
  .entry .note{
    font-size:14.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry .date{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .entry .sum{
    font-size:15px;
    color:var(--danger);
    white-space:nowrap;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .entry .del{
    background:none;border:none;color:#a89d84;
    font-size:16px;cursor:pointer;padding:2px 4px;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 0;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="tab">Xoʻjalik daftari</div>
    <h1>Oylik hisob</h1>
    <div class="sub">Daromad va xarajatlaringiz shu yerda</div>
    <div class="income-row">
      <label>Oylik daromad</label>
      <input type="number" id="incomeInput" placeholder="0" inputmode="decimal">
      <span>soʻm ×1000</span>
    </div>
  </header>

  <div class="summary">
    <canvas id="donut" width="90" height="90"></canvas>
    <div class="summary-text">
      <div class="big" id="balanceText">0 ming</div>
      <div class="small">qolgan mablagʻ</div>
      <div class="small" id="spentText" style="margin-top:6px;">jami sarf: 0 ming</div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="add-card">
    <div class="title">Yangi xarajat</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="field-row">
      <input type="number" id="sumInput" placeholder="Summa (ming soʻm)" inputmode="decimal">
    </div>
    <div class="field-row">
      <input type="text" id="noteInput" placeholder="Izoh (ixtiyoriy)">
    </div>
    <button class="add-btn" onclick="addExpense()">+ Qoʻshish</button>
  </div>

  <div class="ledger">
    <div class="title">Soʻnggi yozuvlar</div>
    <div id="entryList"></div>
  </div>
</div>

<script>
const CATEGORIES = [
  {id:'ovqat',   label:'Ovqat',     icon:'🍽️', color:'#a14e3a'},
  {id:'transport',label:'Transport', icon:'🚗', color:'#3c5a6b'},
  {id:'kommunal', label:'Kommunal',  icon:'🏠', color:'#b9862f'},
  {id:'chorva',   label:'Chorva',    icon:'🐄', color:'#4c6b4f'},
  {id:'bolalar',  label:'Bolalarga', icon:'🧸', color:'#946b8f'},
  {id:'boshqa',   label:'Boshqa',    icon:'✳️', color:'#6b6252'},
];

let state = { income: 0, expenses: [] };
let selectedCat = 'ovqat';
const STORAGE_KEY = 'monthly-budget-v1';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){
    // no data yet
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Saqlashda xatolik', e);
  }
}

function buildCatGrid(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat.id === selectedCat ? ' active' : '');
    btn.innerHTML = `${cat.icon}<span class="lbl">${cat.label}</span>`;
    btn.onclick = () => { selectedCat = cat.id; buildCatGrid(); };
    grid.appendChild(btn);
  });
}

function fmt(n){
  return Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
}

function addExpense(){
  const sumInput = document.getElementById('sumInput');
  const noteInput = document.getElementById('noteInput');
  const amount = parseFloat(sumInput.value);
  if(!amount || amount <= 0) return;
  state.expenses.unshift({
    id: Date.now(),
    cat: selectedCat,
    amount: amount,
    note: noteInput.value.trim(),
    date: new Date().toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit'})
  });
  sumInput.value = '';
  noteInput.value = '';
  saveState();
  render();
}

function deleteExpense(id){
  state.expenses = state.expenses.filter(e => e.id !== id);
  saveState();
  render();
}

function onIncomeChange(){
  const val = parseFloat(document.getElementById('incomeInput').value);
  state.income = val || 0;
  saveState();
  render();
}

function catTotals(){
  const totals = {};
  CATEGORIES.forEach(c => totals[c.id] = 0);
  state.expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
  return totals;
}

function drawDonut(totals, totalSpent){
  const canvas = document.getElementById('donut');
  const ctx = canvas.getContext('2d');
  const cx = 45, cy = 45, rOuter = 42, rInner = 26;
  ctx.clearRect(0,0,90,90);
  if(totalSpent <= 0){
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.strokeStyle = '#d8cba9';
    ctx.lineWidth = rOuter - rInner;
    ctx.stroke();
    return;
  }
  let start = -Math.PI/2;
  CATEGORIES.forEach(cat => {
    const val = totals[cat.id] || 0;
    if(val <= 0) return;
    const slice = (val/totalSpent) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, (rOuter+rInner)/2, start, start+slice);
    ctx.lineWidth = rOuter - rInner;
    ctx.strokeStyle = cat.color;
    ctx.stroke();
    start += slice;
  });
}

function render(){
  document.getElementById('incomeInput').value = state.income || '';
  const totals = catTotals();
  const totalSpent = Object.values(totals).reduce((a,b)=>a+b,0);
  const balance = (state.income || 0) - totalSpent;

  const balanceEl = document.getElementById('balanceText');
  balanceEl.textContent = fmt(balance) + ' ming';
  balanceEl.className = 'big' + (balance < 0 ? ' neg' : '');
  document.getElementById('spentText').textContent = 'jami sarf: ' + fmt(totalSpent) + ' ming';

  drawDonut(totals, totalSpent);

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const val = totals[cat.id] || 0;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.icon} ${cat.label}<span class="amt">${fmt(val)}</span>`;
    legend.appendChild(item);
  });

  const list = document.getElementById('entryList');
  list.innerHTML = '';
  if(state.expenses.length === 0){
    list.innerHTML = '<div class="empty">Hali yozuv yoʻq — birinchi xarajatni qoʻshing</div>';
  } else {
    state.expenses.forEach(e => {
      const cat = CATEGORIES.find(c => c.id === e.cat) || CATEGORIES[4];
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="icon" style="background:${cat.color}22;">${cat.icon}</div>
        <div class="info">
          <div class="note">${e.note ? e.note : cat.label}</div>
          <div class="date">${e.date} · ${cat.label}</div>
        </div>
        <div class="sum">−${fmt(e.amount)}</div>
        <button class="del" onclick="deleteExpense(${e.id})">✕</button>
      `;
      list.appendChild(row);
    });
  }
}

document.getElementById('incomeInput').addEventListener('input', onIncomeChange);
buildCatGrid();
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
