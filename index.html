<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Cash">
<meta name="theme-color" content="#eef6f3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Money Cash — oylik hisob</title>
<style>
  :root{
    --paper:#eef6f3;
    --paper-dark:#dcece5;
    --ink:#132723;
    --ink-soft:#5f7d75;
    --line:#c7e0d7;
    --barn:#d9584f;
    --field:#1f8a70;
    --coin:#2f9e8f;
    --sky:#3f8fc4;
    --card:#ffffff;
    --danger:#d9584f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family: 'Manrope', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:0;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:transparent;
    position:relative;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
  }
  header{
    padding:26px 22px 14px;
    border-bottom:2px solid var(--ink);
    position:relative;
  }
  h1{
    font-size:26px;
    margin:8px 0 2px;
    letter-spacing:0.5px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:13px;
    font-family:'Manrope', sans-serif;
  }

  .income-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-top:14px;
    font-family:'Manrope', sans-serif;
  }
  .income-row label{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .income-row input{
    border:none;
    border-bottom:1.5px dashed var(--ink);
    background:transparent;
    font-family:'Manrope', sans-serif;
    font-size:20px;
    color:var(--ink);
    width:150px;
    padding:2px 0;
    outline:none;
  }

  .summary{
    margin:18px 22px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    box-shadow:0 3px 0 rgba(46,42,34,0.06);
    display:flex;
    align-items:center;
    gap:16px;
  }
  #donut{ flex-shrink:0; }
  .summary-text{ font-family:'Manrope', sans-serif; }
  .summary-text .big{
    font-family:'Manrope', sans-serif;
    font-size:22px;
    color:var(--ink);
  }
  .summary-text .big.neg{ color:var(--danger); }
  .summary-text .small{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .legend{
    margin:14px 22px 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 14px;
    font-family:'Manrope', sans-serif;
    font-size:12.5px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .legend-item .dot{
    width:9px;height:9px;border-radius:2px;flex-shrink:0;
  }
  .legend-item .amt{
    margin-left:auto;
    color:var(--ink);
  }
  .legend-item .pct{
    color:var(--ink-soft);
    font-size:11px;
  }

  .budget-bar{
    width:150px;
    height:5px;
    background:var(--paper-dark);
    border-radius:3px;
    overflow:hidden;
    margin-top:8px;
  }
  .budget-fill{
    height:100%;
    background:var(--field);
    border-radius:3px;
    transition:width 0.3s ease;
    width:0%;
  }
  .budget-fill.over{ background:var(--danger); }

  .add-card{
    margin:20px 22px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .add-card .title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    font-family:'Manrope', sans-serif;
    margin-bottom:10px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:12px;
  }
  .cat-btn{
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    padding:8px 2px;
    font-size:19px;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    transition: all 0.12s;
  }
  .cat-btn .lbl{
    display:block;
    font-size:9px;
    margin-top:2px;
    color:var(--ink-soft);
  }
  .cat-btn.active{
    border-color:var(--ink);
    background:var(--ink);
  }
  .cat-btn.active .lbl{ color:var(--paper); }

  .field-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .field-row input{
    flex:1;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:7px;
    padding:9px 10px;
    font-family:'Manrope', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  .field-row input::placeholder{ color:#9db5ad; }

  .add-btn{
    width:100%;
    border:none;
    background:var(--field);
    color:var(--card);
    padding:11px;
    border-radius:8px;
    font-size:14px;
    letter-spacing:0.5px;
    font-family:'Manrope', sans-serif;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.98); }

  .ledger{
    margin:20px 22px 0;
  }
  .ledger .title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    font-family:'Manrope', sans-serif;
    margin-bottom:8px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry .icon{
    width:32px;height:32px;
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .entry .info{ flex:1; min-width:0; }
  .entry .note{
    font-size:14.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry .date{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Manrope', sans-serif;
  }
  .entry .sum{
    font-size:15px;
    color:var(--danger);
    white-space:nowrap;
    font-family:'Manrope', sans-serif;
  }
  .entry .del{
    background:none;border:none;color:#9db5ad;
    font-size:16px;cursor:pointer;padding:2px 4px;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 0;
    font-family:'Manrope', sans-serif;
  }

  .stats-card{
    margin:20px 22px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .stats-card .title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    font-family:'Manrope', sans-serif;
    margin-bottom:10px;
  }
  .stats-toggle{
    display:flex;
    width:100%;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:20px;
    padding:3px;
    margin-bottom:14px;
    user-select:none;
    font-family:'Manrope', sans-serif;
  }
  .stats-toggle .opt{
    flex:1;
    text-align:center;
    padding:7px 4px;
    border-radius:16px;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all 0.2s ease;
    white-space:nowrap;
  }
  .stats-toggle .opt.active{
    background:var(--ink);
    color:var(--paper);
  }
  #statsChart{
    width:100%;
    display:block;
  }
  .stats-trend{
    margin-top:12px;
    font-family:'Manrope', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .stats-trend b{ color:var(--ink); }
  .stats-trend .up{ color:var(--danger); }
  .stats-trend .down{ color:var(--field); }

  .summary, .add-card, .stats-card{ box-shadow:0 6px 18px rgba(19,39,35,0.06); border-radius:16px; }
  .cat-btn{ border-radius:12px; }
  .add-btn{ border-radius:12px; }

  body.dark{
    --paper:#17140f; --paper-dark:#211d16; --ink:#f3ecd9; --ink-soft:#a89d89;
    --line:#3a352b; --barn:#e0836a; --field:#6fbf78; --coin:#e6b84f;
    --sky:#6cb3d6; --card:#211d16; --danger:#e0836a;
  }
  body.dark .summary, body.dark .add-card, body.dark .stats-card{
    box-shadow:none; border:1px solid var(--line);
  }

  .header-icons{
    position:absolute;
    top:26px;
    right:22px;
    display:flex;
    gap:8px;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(19,39,35,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    width:100%;
    max-width:340px;
    max-height:85vh;
    overflow-y:auto;
    font-family:'Manrope', sans-serif;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .modal-head h2{
    font-size:16px;
    margin:0;
    color:var(--ink);
  }
  .modal-close{
    border:none;
    background:none;
    font-size:18px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:2px 6px;
  }

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-nav button{
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    width:30px;height:30px;
    font-size:15px;
    cursor:pointer;
  }
  .cal-nav .cal-label{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    text-align:center;
  }
  .cal-dow{
    font-size:10px;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .cal-day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.today{ border:1.5px solid var(--field); }
  .cal-day.selected{ background:var(--field); color:#fff; }
  .cal-day .dot{
    position:absolute;
    bottom:3px;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--coin);
  }
  .cal-day.selected .dot{ background:#fff; }
  .cal-summary{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cal-summary b{ color:var(--ink); }

  .calc-display{
    background:var(--paper);
    border-radius:10px;
    padding:16px;
    text-align:right;
    margin-bottom:12px;
  }
  .calc-display .prev{ font-size:12px; color:var(--ink-soft); min-height:16px; }
  .calc-display .curr{ font-size:28px; color:var(--ink); }
  .calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .calc-grid button{
    border:none;
    border-radius:8px;
    padding:14px 0;
    font-size:16px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .calc-grid button.op{ background:var(--sky); color:#fff; }
  .calc-grid button.eq{ background:var(--field); color:#fff; }
  .calc-grid button.wide{ grid-column:span 2; }
  .calc-use{
    width:100%;
    margin-top:10px;
    border:none;
    background:var(--coin);
    color:#fff;
    padding:11px;
    border-radius:8px;
    font-size:13.5px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="header-icons">
      <button class="icon-btn" onclick="openCalendar()">📅</button>
      <button class="icon-btn" onclick="openCalculator()">🧮</button>
      <button class="icon-btn" id="modeToggle" onclick="toggleDarkMode()">🌙</button>
    </div>
    <h1>Money Cash</h1>
    <div class="sub">Oylik daromad va xarajat hisobingiz</div>
    <div class="income-row">
      <label>Oylik daromad</label>

      <input type="text" id="incomeInput" placeholder="0" inputmode="decimal">
      <span>soʻm ×1000</span>
    </div>
  </header>


  <div class="summary">
    <canvas id="donut" width="90" height="90"></canvas>
    <div class="summary-text">
      <div class="big" id="balanceText">0 ming</div>
      <div class="small">qolgan mablagʻ</div>
      <div class="small" id="spentText" style="margin-top:6px;">jami sarf: 0 ming</div>
      <div class="budget-bar"><div class="budget-fill" id="budgetFill"></div></div>
      <div class="small" id="budgetPct">byudjetning 0% ishlatildi</div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="add-card">
    <div class="title">Yangi xarajat</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="field-row">
      <input type="text" id="sumInput" placeholder="Summa (ming soʻm)" inputmode="decimal">
    </div>
    <div class="field-row">
      <input type="text" id="noteInput" placeholder="Izoh (ixtiyoriy)">
    </div>
    <button class="add-btn" onclick="addExpense()">+ Qoʻshish</button>
  </div>

  <div class="stats-card">
    <div class="title">Statistika</div>
    <div class="stats-toggle" id="statsToggle">
      <span class="opt active" data-mode="weekly" onclick="setStatsMode('weekly')">Haftalik</span>
      <span class="opt" data-mode="15day" onclick="setStatsMode('15day')">15 kunlik</span>
      <span class="opt" data-mode="monthly" onclick="setStatsMode('monthly')">Oylik</span>
      <span class="opt" data-mode="yearly" onclick="setStatsMode('yearly')">Yillik</span>
    </div>
    <canvas id="statsChart" width="340" height="155"></canvas>
    <div class="stats-trend" id="statsTrend"></div>
  </div>

  <div class="ledger">
    <div class="title">Soʻnggi yozuvlar</div>
    <div id="entryList"></div>
  </div>
</div>

<div class="modal-overlay" id="calendarOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Kalendar</h2>
      <button class="modal-close" onclick="closeModal('calendarOverlay')">✕</button>
    </div>
    <div class="cal-nav">
      <button onclick="calShiftMonth(-1)">‹</button>
      <div class="cal-label" id="calLabel"></div>
      <button onclick="calShiftMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-summary" id="calSummary">Kunni tanlang</div>
  </div>
</div>

<div class="modal-overlay" id="calcOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Kalkulyator</h2>
      <button class="modal-close" onclick="closeModal('calcOverlay')">✕</button>
    </div>
    <div class="calc-display">
      <div class="prev" id="calcPrev">&nbsp;</div>
      <div class="curr" id="calcCurr">0</div>
    </div>
    <div class="calc-grid">
      <button onclick="calcClear()">C</button>
      <button onclick="calcDelete()">⌫</button>
      <button onclick="calcSign()">±</button>
      <button class="op" onclick="calcOp('÷')">÷</button>

      <button onclick="calcNum('7')">7</button>
      <button onclick="calcNum('8')">8</button>
      <button onclick="calcNum('9')">9</button>
      <button class="op" onclick="calcOp('×')">×</button>

      <button onclick="calcNum('4')">4</button>
      <button onclick="calcNum('5')">5</button>
      <button onclick="calcNum('6')">6</button>
      <button class="op" onclick="calcOp('−')">−</button>

      <button onclick="calcNum('1')">1</button>
      <button onclick="calcNum('2')">2</button>
      <button onclick="calcNum('3')">3</button>
      <button class="op" onclick="calcOp('+')">+</button>

      <button class="wide" onclick="calcNum('0')">0</button>
      <button onclick="calcNum('.')">.</button>
      <button class="eq" onclick="calcEquals()">=</button>
    </div>
    <button class="calc-use" onclick="calcUseResult()">Summaga qoʻyish</button>
  </div>
</div>

<script>
const CATEGORIES = [
  {id:'ovqat',   label:'Ovqat',     icon:'🍽️'},
  {id:'transport',label:'Transport', icon:'🚗'},
  {id:'kommunal', label:'Kommunal',  icon:'🏠'},
  {id:'chorva',   label:'Chorva',    icon:'🐄'},
  {id:'bolalar',  label:'Bolalarga', icon:'🧸'},
  {id:'kunlik',   label:'Kunlik chiqim', icon:'🛒'},
  {id:'tolov',    label:'Toʻlov',    icon:'💳'},
  {id:'boshqa',   label:'Boshqa',    icon:'✳️'},
];

const PALETTES = {
  light: {
    cat: ['#d9584f','#3f8fc4','#e0a83e','#1f8a70','#8f6fd4','#f0883f','#4a5fc4','#5f7d75'],
    emptyRing:'#dcece5', baseline:'#c7e0d7', barCurrent:'#1f8a70', barOther:'#cde6dd',
    textStrong:'#132723', textSoft:'#8ba79d'
  },
  dark: {
    cat: ['#e0836a','#6cb3d6','#e6b84f','#6fbf78','#c99bd6','#f0a35c','#9c93e0','#a89d89'],
    emptyRing:'#2c2820', baseline:'#3a352b', barCurrent:'#e6b84f', barOther:'#3a352b',
    textStrong:'#f3ecd9', textSoft:'#786f5c'
  }
};

function palette(){ return state.dark ? PALETTES.dark : PALETTES.light; }
function catColor(id){
  const idx = CATEGORIES.findIndex(c => c.id === id);
  return palette().cat[idx] || '#999';
}

let state = { income: 0, expenses: [], dark: false };
let selectedCat = 'ovqat';
const STORAGE_KEY = 'monthly-budget-v1';

function applyMode(){
  document.body.classList.toggle('dark', !!state.dark);
  document.getElementById('modeToggle').textContent = state.dark ? '☀️' : '🌙';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', state.dark ? '#17140f' : '#eef6f3');
}

function toggleDarkMode(){
  state.dark = !state.dark;
  applyMode();
  saveState();
  render();
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(typeof state.dark !== 'boolean') state.dark = false;
      if(!Array.isArray(state.expenses)) state.expenses = [];
    }
  }catch(e){
    // no data yet
  }
  applyMode();
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Saqlashda xatolik', e);
  }
}

function buildCatGrid(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat.id === selectedCat ? ' active' : '');
    btn.innerHTML = `${cat.icon}<span class="lbl">${cat.label}</span>`;
    btn.onclick = () => { selectedCat = cat.id; buildCatGrid(); };
    grid.appendChild(btn);
  });
}

function fmt(n){
  return Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
}

function parseFormattedNumber(str){
  const cleaned = String(str || '').replace(/\s/g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function formatInputLive(el){
  const cursorFromEnd = el.value.length - el.selectionStart;
  let raw = el.value.replace(/[^\d.,]/g, '');
  raw = raw.replace(',', '.');
  const firstDot = raw.indexOf('.');
  if(firstDot !== -1){
    raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
  }
  let [intPart, decPart] = raw.split('.');
  intPart = intPart.replace(/^0+(?=\d)/, '');
  const formattedInt = intPart ? Number(intPart).toLocaleString('ru-RU').replace(/,/g, ' ') : '';
  const newValue = decPart !== undefined ? `${formattedInt}.${decPart}` : formattedInt;
  el.value = newValue;
  const pos = Math.max(0, newValue.length - cursorFromEnd);
  el.setSelectionRange(pos, pos);
}

function addExpense(){
  const sumInput = document.getElementById('sumInput');
  const noteInput = document.getElementById('noteInput');
  const amount = parseFormattedNumber(sumInput.value);
  if(!amount || amount <= 0) return;
  state.expenses.unshift({
    id: Date.now(),
    cat: selectedCat,
    amount: amount,
    note: noteInput.value.trim(),
    ts: Date.now(),
    date: new Date().toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit'})
  });
  sumInput.value = '';
  noteInput.value = '';
  saveState();
  render();
}

function deleteExpense(id){
  state.expenses = state.expenses.filter(e => e.id !== id);
  saveState();
  render();
}

function onIncomeChange(){
  const val = parseFormattedNumber(document.getElementById('incomeInput').value);
  state.income = val || 0;
  saveState();
  render();
}

function catTotals(){
  const totals = {};
  CATEGORIES.forEach(c => totals[c.id] = 0);
  state.expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
  return totals;
}

function drawDonut(totals, totalSpent){
  const canvas = document.getElementById('donut');
  const ctx = canvas.getContext('2d');
  const cx = 45, cy = 45, rOuter = 42, rInner = 26;
  ctx.clearRect(0,0,90,90);
  if(totalSpent <= 0){
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.strokeStyle = palette().emptyRing;
    ctx.lineWidth = rOuter - rInner;
    ctx.stroke();
    return;
  }
  let start = -Math.PI/2;
  CATEGORIES.forEach(cat => {
    const val = totals[cat.id] || 0;
    if(val <= 0) return;
    const slice = (val/totalSpent) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, (rOuter+rInner)/2, start, start+slice);
    ctx.lineWidth = rOuter - rInner;
    ctx.strokeStyle = catColor(cat.id);
    ctx.stroke();
    start += slice;
  });
}

function render(){
  const incomeEl = document.getElementById('incomeInput');
  if(document.activeElement !== incomeEl){
    incomeEl.value = state.income ? fmt(state.income) : '';
  }
  const totals = catTotals();
  const totalSpent = Object.values(totals).reduce((a,b)=>a+b,0);
  const balance = (state.income || 0) - totalSpent;

  const balanceEl = document.getElementById('balanceText');
  balanceEl.textContent = fmt(balance) + ' ming';
  balanceEl.className = 'big' + (balance < 0 ? ' neg' : '');
  document.getElementById('spentText').textContent = 'jami sarf: ' + fmt(totalSpent) + ' ming';

  const income = state.income || 0;
  const budgetPct = income > 0 ? Math.round((totalSpent / income) * 100) : 0;
  const fillEl = document.getElementById('budgetFill');
  fillEl.style.width = Math.min(budgetPct, 100) + '%';
  fillEl.classList.toggle('over', budgetPct > 100);
  document.getElementById('budgetPct').textContent = income > 0
    ? `byudjetning ${budgetPct}% ishlatildi`
    : 'daromadni kiriting';

  drawDonut(totals, totalSpent);

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const val = totals[cat.id] || 0;
    const pct = totalSpent > 0 ? Math.round((val / totalSpent) * 100) : 0;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="dot" style="background:${catColor(cat.id)}"></span>${cat.icon} ${cat.label}<span class="amt">${fmt(val)} <span class="pct">(${pct}%)</span></span>`;
    legend.appendChild(item);
  });

  const list = document.getElementById('entryList');
  list.innerHTML = '';
  if(state.expenses.length === 0){
    list.innerHTML = '<div class="empty">Hali yozuv yoʻq — birinchi xarajatni qoʻshing</div>';
  } else {
    state.expenses.forEach(e => {
      const cat = CATEGORIES.find(c => c.id === e.cat) || CATEGORIES[4];
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="icon" style="background:${catColor(cat.id)}22;">${cat.icon}</div>
        <div class="info">
          <div class="note">${e.note ? e.note : cat.label}</div>
          <div class="date">${e.date} · ${cat.label}</div>
        </div>
        <div class="sum">−${fmt(e.amount)}</div>
        <button class="del" onclick="deleteExpense(${e.id})">✕</button>
      `;
      list.appendChild(row);
    });
  }

  renderStats();
}

let statsMode = 'weekly';
const MONTH_NAMES = ['Yan','Fev','Mar','Apr','May','Iyun','Iyul','Avg','Sen','Okt','Noy','Dek'];

function setStatsMode(mode){
  statsMode = mode;
  document.querySelectorAll('#statsToggle .opt').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  renderStats();
}

function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // Monday = 0
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}

function buildPeriods(mode){
  const periods = [];
  const now = new Date();

  if(mode === 'monthly'){
    for(let i = 5; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      periods.push({
        key: d.getFullYear() + '-' + d.getMonth(),
        label: MONTH_NAMES[d.getMonth()],
        start: d,
        end: new Date(d.getFullYear(), d.getMonth() + 1, 1)
      });
    }
  } else if(mode === 'weekly'){
    const thisWeekStart = startOfWeek(now);
    for(let i = 7; i >= 0; i--){
      const start = new Date(thisWeekStart);
      start.setDate(start.getDate() - i * 7);
      const end = new Date(start);
      end.setDate(end.getDate() + 7);
      periods.push({
        key: start.getTime(),
        label: start.getDate() + '-' + MONTH_NAMES[start.getMonth()],
        start, end
      });
    }
  } else if(mode === '15day'){
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    for(let i = 5; i >= 0; i--){
      const end = new Date(today);
      end.setDate(end.getDate() - i * 15);
      const start = new Date(end);
      start.setDate(start.getDate() - 15);
      periods.push({
        key: start.getTime(),
        label: start.getDate() + '-' + MONTH_NAMES[start.getMonth()],
        start, end
      });
    }
  } else if(mode === 'yearly'){
    for(let i = 3; i >= 0; i--){
      const y = now.getFullYear() - i;
      periods.push({
        key: y,
        label: String(y),
        start: new Date(y, 0, 1),
        end: new Date(y + 1, 0, 1)
      });
    }
  }
  return periods;
}

function statsData(mode){
  const periods = buildPeriods(mode);
  periods.forEach(p => { p.total = 0; p.catTotals = {}; });
  state.expenses.forEach(e => {
    if(!e.ts) return;
    const t = e.ts;
    const p = periods.find(pr => t >= pr.start.getTime() && t < pr.end.getTime());
    if(p){
      p.total += e.amount;
      p.catTotals[e.cat] = (p.catTotals[e.cat] || 0) + e.amount;
    }
  });
  return periods;
}

function drawBarChart(periods){
  const canvas = document.getElementById('statsChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const max = Math.max(...periods.map(p => p.total), 1);
  const chartH = h - 28;
  const barW = w / periods.length;
  const gap = barW * 0.34;

  // baseline
  ctx.strokeStyle = palette().baseline;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, chartH + 0.5);
  ctx.lineTo(w, chartH + 0.5);
  ctx.stroke();

  periods.forEach((p, i) => {
    const barH = p.total > 0 ? Math.max((p.total / max) * (chartH - 24), 3) : 0;
    const x = i * barW + gap/2;
    const y = chartH - barH;
    const isLast = i === periods.length - 1;
    const bw = barW - gap;

    if(barH > 0){
      ctx.fillStyle = isLast ? palette().barCurrent : palette().barOther;
      ctx.beginPath();
      const r = Math.min(4, bw/2);
      ctx.moveTo(x, chartH);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.lineTo(x + bw - r, y);
      ctx.arcTo(x + bw, y, x + bw, y + r, r);
      ctx.lineTo(x + bw, chartH);
      ctx.closePath();
      ctx.fill();

      if(p.total > 0){
        ctx.fillStyle = isLast ? palette().textStrong : palette().textSoft;
        ctx.font = isLast ? 'bold 10px Helvetica Neue, Arial, sans-serif' : '9px Helvetica Neue, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(fmt(p.total), x + bw/2, y - 5);
      }
    }

    ctx.fillStyle = isLast ? palette().textStrong : palette().textSoft;
    ctx.font = isLast ? 'bold 10px Helvetica Neue, Arial, sans-serif' : '10px Helvetica Neue, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.label, x + bw/2, h - 8);
  });
}

function topCategory(period){
  let best = null, bestVal = 0;
  CATEGORIES.forEach(c => {
    const v = period.catTotals[c.id] || 0;
    if(v > bestVal){ bestVal = v; best = c; }
  });
  return best;
}

function renderStats(){
  const periods = statsData(statsMode);
  drawBarChart(periods);

  const trendEl = document.getElementById('statsTrend');
  const curr = periods[periods.length - 1];
  const prev = periods[periods.length - 2];
  const periodWords = { weekly:'haftaga', '15day':'15 kunlikka', monthly:'oyga', yearly:'yilga' };
  const periodWord = periodWords[statsMode] || 'davrga';

  let trendHtml = `Joriy davr sarfi: <b>${fmt(curr.total)} ming</b>`;
  if(prev && prev.total > 0){
    const diff = curr.total - prev.total;
    const pct = Math.round((diff / prev.total) * 100);
    if(diff > 0){
      trendHtml += `<br>Oldingi ${periodWord} nisbatan <span class="up">${pct}% koʻp</span> sarfladingiz`;
    } else if(diff < 0){
      trendHtml += `<br>Oldingi ${periodWord} nisbatan <span class="down">${Math.abs(pct)}% kam</span> sarfladingiz`;
    } else {
      trendHtml += `<br>Oldingi ${periodWord} bilan bir xil`;
    }
  }
  const top = topCategory(curr);
  if(top && curr.total > 0){
    const topPct = Math.round((curr.catTotals[top.id] / curr.total) * 100);
    trendHtml += `<br>Eng koʻp sarf: ${top.icon} ${top.label} (${topPct}%)`;
  }
  trendEl.innerHTML = trendHtml;
}

/* ---------- Modal helpers ---------- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ---------- Calendar ---------- */
let calDate = new Date();
const DOW = ['Du','Se','Chor','Pay','Ju','Sha','Yak'];

function openCalendar(){
  calDate = new Date();
  renderCalendar();
  openModal('calendarOverlay');
}

function calShiftMonth(delta){
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + delta, 1);
  renderCalendar();
}

function dayKey(d){
  return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
}

function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calLabel').textContent = MONTH_NAMES[m] + ' ' + y;

  const byDay = {};
  state.expenses.forEach(e => {
    if(!e.ts) return;
    const d = new Date(e.ts);
    if(d.getFullYear() === y && d.getMonth() === m){
      const k = dayKey(d);
      if(!byDay[k]) byDay[k] = { total: 0, cats: {} };
      byDay[k].total += e.amount;
      byDay[k].cats[e.cat] = (byDay[k].cats[e.cat] || 0) + e.amount;
    }
  });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  for(let i = 0; i < startOffset; i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for(let day = 1; day <= daysInMonth; day++){
    const el = document.createElement('div');
    const k = y + '-' + m + '-' + day;
    el.className = 'cal-day';
    if(today.getFullYear() === y && today.getMonth() === m && today.getDate() === day){
      el.classList.add('today');
    }
    el.innerHTML = day + (byDay[k] ? '<span class="dot"></span>' : '');
    el.onclick = (ev) => selectCalDay(ev, y, m, day, byDay[k]);
    grid.appendChild(el);
  }

  document.getElementById('calSummary').textContent = 'Kunni tanlang';
}

function selectCalDay(ev, y, m, day, data){
  document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
  ev.currentTarget.classList.add('selected');

  const summary = document.getElementById('calSummary');
  if(!data){
    summary.innerHTML = `${day}-kun: xarajat yoʻq`;
    return;
  }
  let html = `${day}-kun jami: <b>${fmt(data.total)} ming</b><br>`;
  CATEGORIES.forEach(c => {
    if(data.cats[c.id]){
      html += `${c.icon} ${c.label}: ${fmt(data.cats[c.id])} &nbsp; `;
    }
  });
  summary.innerHTML = html;
}

/* ---------- Calculator ---------- */
let calcCurrent = '0';
let calcPrevious = '';
let calcOperation = null;

function openCalculator(){
  calcClear();
  openModal('calcOverlay');
}

function calcUpdate(){
  document.getElementById('calcCurr').textContent = calcCurrent;
  document.getElementById('calcPrev').textContent = calcPrevious ? `${calcPrevious} ${calcOperation}` : '\u00A0';
}

function calcNum(n){
  if(n === '.' && calcCurrent.includes('.')) return;
  calcCurrent = (calcCurrent === '0' && n !== '.') ? n : calcCurrent + n;
  calcUpdate();
}

function calcOp(op){
  if(calcOperation !== null) calcEquals();
  calcPrevious = calcCurrent;
  calcOperation = op;
  calcCurrent = '0';
  calcUpdate();
}

function calcEquals(){
  if(calcOperation === null || calcPrevious === '') return;
  const a = parseFloat(calcPrevious), b = parseFloat(calcCurrent);
  let result;
  switch(calcOperation){
    case '+': result = a + b; break;
    case '−': result = a - b; break;
    case '×': result = a * b; break;
    case '÷': result = b === 0 ? NaN : a / b; break;
  }
  calcCurrent = Number.isNaN(result) ? 'Xato' : String(parseFloat(result.toFixed(6)));
  calcOperation = null;
  calcPrevious = '';
  calcUpdate();
}

function calcClear(){
  calcCurrent = '0'; calcPrevious = ''; calcOperation = null;
  calcUpdate();
}

function calcDelete(){
  calcCurrent = calcCurrent.length > 1 ? calcCurrent.slice(0, -1) : '0';
  calcUpdate();
}

function calcSign(){
  if(calcCurrent === '0') return;
  calcCurrent = calcCurrent.startsWith('-') ? calcCurrent.slice(1) : '-' + calcCurrent;
  calcUpdate();
}

function calcUseResult(){
  if(calcOperation !== null) calcEquals();
  const sumEl = document.getElementById('sumInput');
  sumEl.value = calcCurrent;
  formatInputLive(sumEl);
  closeModal('calcOverlay');
}
